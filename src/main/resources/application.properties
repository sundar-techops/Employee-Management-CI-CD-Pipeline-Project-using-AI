# H2 in-memory database (perfect for demos - no real DB needed)
spring.datasource.url=jdbc:h2:mem:employeedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console (lets you view the DB in browser at /h2-console)
spring.h2.console.enabled=true

# Expose health, info, Prometheus and metrics endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Add application name to metrics
spring.application.name=employee-management-api

server.port=8080